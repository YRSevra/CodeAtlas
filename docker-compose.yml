services:
  postgres:
    image: postgres:16-alpine
    container_name: codeatlas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: codeatlas
      POSTGRES_PASSWORD: codeatlas_dev_password
      POSTGRES_DB: codeatlas
    ports:
      - "5432:5432"
    volumes:
      - codeatlas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeatlas -d codeatlas"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  codeatlas_pgdata:
